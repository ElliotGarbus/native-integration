# pymapbox — HYPOTHETICAL, clean-sheet. Mapbox Maps SDK.
#
# Chosen for one reason: §6.6 (Maven repositories) was the only declarable
# table with zero coverage across nine sidecars, and it carries the strongest
# language in the specification — "a supply-chain concern of a different order
# than any other contribution." Mapbox is the canonical custom-repository case.
#
# It exercises §6.6, and then breaks it. See NOTES.md, finding M2.

contract = "1"
platforms = ["android", "ios"]

# ---------------------------------------------------------------- Android ---

[android.requires]
min_sdk = 21
compile_sdk = 34

[[android.contributes.gradle_repositories]]
# §6.6's first use anywhere in the example set. The group restriction is not
# decoration: it is what keeps this repository from being able to shadow
# anything else in the build, and Mapbox's own artifacts are the only thing it
# should ever serve.
url = "https://api.mapbox.com/downloads/v2/releases/maven"
reason = """\
Mapbox does not publish its Maps SDK artifacts to Maven Central. Access needs a \
Mapbox token scoped DOWNLOADS:READ, used as the password with username \
"mapbox"; create one in the Mapbox account dashboard."""
groups = ["com.mapbox"]
# Finding M2. The flag says only that the repository is authenticated — the
# token is never named here, because a sidecar is package data in a wheel and
# §9 would hash it into a committed record. The application supplies it
# through the consumer's own configuration.
credentials_required = true

[[android.contributes.gradle_dependencies]]
module = "com.mapbox.maps:android"
version = { at_least = "11.0.0", below = "12.0.0" }

[[android.contributes.permissions]]
name = "android.permission.INTERNET"
reason = "Downloading map tiles and styles"

[android.contributes.r8]
keep_classes = ["com.mapbox.**"]

# -------------------------------------------------------------------- iOS ---

[ios.requires]
deployment_target = "14.0"

[[ios.contributes.swift_packages]]
name = "MapboxMaps"
url = "https://github.com/mapbox/mapbox-maps-ios"
requirement = { from = "11.0.0" }
products = ["MapboxMaps"]

# ------------------------------------------------------------ NOT EXPRESSIBLE
#
# M3  The public access token. Different token, different purpose: `pk.`,
#     runtime, per-application. Android reads it from a string resource
#     (res/values/, excluded by §11) and iOS from Info.plist `MBXAccessToken` —
#     but both platforms accept `MapboxOptions.accessToken` programmatically,
#     so a Python wrapper passes it in and neither surface is needed. Eighth
#     package in a row where runtime configuration flows through Python.
#
# M4  ACCESS_FINE_LOCATION is deliberately absent. It is needed only for the
#     location puck, which is one feature of many — exactly the case §12 says
#     belongs in an optional distribution (`pymapbox[location]`), and here that
#     split is genuinely available. §12's guidance applies cleanly.
#
# M5  `com.mapbox.maps:android-ndk27` is the variant for applications built
#     for 16 KB memory pages; `:android` is the other. Choosing between them is
#     a conditional contribution keyed on a build property — the shape §10
#     anticipates with a closed `when` vocabulary, and the first real instance
#     of it in the example set.
