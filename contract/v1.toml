# ------------------------------------------------------------- Constraints ---
#
# Rules between keys rather than properties of one, which is why they are not
# rows above. The set of `rule` values is deliberately tiny and closed: each is
# something a JSON Schema `if`/`then` can express, which is the boundary Phase 1
# draws. Anything needing the dependency closure, the wheel's files, or another
# sidecar is a semantic rule and belongs in code.

[[constraints]]
scope = "<platform>.requires.application_value"
rule = "required_unless_equals"
field = "key"
other = "kind"
value = "inline"
section = "5.2"

[[constraints]]
scope = "<platform>.requires.application_value"
rule = "forbidden_if_equals"
field = "key"
other = "kind"
value = "inline"
section = "5.5"

# §5.5's two *UsageDescription rules are a pair: `usage_description` MUST name
# such a key and `info_plist` MUST NOT, and `info_plist` reaches no key §7.4
# refuses.
[[constraints]]
scope = "<platform>.requires.application_value"
rule = "pattern_if_equals"
field = "key"
other = "kind"
value = "usage_description"
pattern = '.*UsageDescription'
section = "5.5"

[[constraints]]
scope = "<platform>.requires.application_value"
rule = "pattern_forbidden_if_equals"
field = "key"
other = "kind"
value = "info_plist"
pattern = '.*UsageDescription'
section = "5.5"

[[constraints]]
scope = "<platform>.requires.application_value"
rule = "registers_forbidden_if_equals"
field = "key"
other = "kind"
value = "info_plist"
registers = ["capability_keys", "consumer_managed_keys"]
section = "5.5"

[[constraints]]
scope = "android.contributes.gradle_dependencies"
rule = "required_if_present"
field = "version"
other = "module"
section = "6.3"

[[constraints]]
scope = "android.contributes.gradle_dependencies"
rule = "forbidden_if_present"
field = "version"
other = "coordinate"
section = "6.3"

[[constraints]]
scope = "android.contributes.components"
rule = "required_if_present"
field = "reason"
other = "exported_required"
section = "6.6"

[[constraints]]
scope = "android.contributes.components"
rule = "requires_equals"
field = "foreground_service_type"
other = "kind"
value = "service"
section = "6.6"

[[constraints]]
scope = "android.contributes.components"
rule = "requires_equals"
field = "view_links"
other = "kind"
value = "activity"
section = "6.6"

[[constraints]]
scope = "android.contributes.components"
rule = "requires_equals"
field = "view_links"
other = "exported_required"
value = true
section = "6.6"

[[constraints]]
scope = "android.contributes.components"
rule = "forbidden_if_present"
field = "intent_filters"
other = "exported_required"
section = "6.6"

[[constraints]]
scope = "android.contributes.components"
rule = "forbidden_if_present"
field = "intent_filters"
other = "view_links"
section = "6.6"

# §7.2 — a `reason` is REQUIRED when the entry declares `credentials_required`.
[[constraints]]
scope = "ios.contributes.swift_packages"
rule = "required_if_present"
field = "reason"
other = "credentials_required"
section = "7.2"

# §7.1 and §7.3 — both are invalid in a sidecar contributing no Swift source.
# The declarative half is what a schema can see: the `swift` key's presence.
# Whether a declared root that stages no file also counts is ambiguity A12, and
# is stricter than this rather than looser, so nothing here widens on it.
[[constraints]]
scope = "ios.contributes.src"
rule = "requires_present"
field = "symbol_prefixes"
other = "swift"
section = "7.1"

[[constraints]]
scope = "ios.contributes"
rule = "requires_present"
field = "accessed_api_types"
other = "src.swift"
section = "7.3"

# §6.1 — `java_namespaces` is REQUIRED when the distribution contributes Java or
# Kotlin source. The other two triggers it names — producer-sourced components
# and `keep_classes` under its own namespace — need namespace containment, which
# is §8's and is deliberately out of the schema's reach.
[[constraints]]
scope = "android"
rule = "required_if_any_present"
field = "owns.java_namespaces"
any_of = ["contributes.src.java", "contributes.src.kotlin"]
section = "6.1"

# §4.5 — declaring a platform table for a platform `platforms` omits is a
# contradiction a consumer MUST reject.
[[constraints]]
scope = ""
rule = "platform_table_requires_listing"
field = "android"
other = "platforms"
section = "4.5"

[[constraints]]
scope = ""
rule = "platform_table_requires_listing"
field = "ios"
other = "platforms"
section = "4.5"
