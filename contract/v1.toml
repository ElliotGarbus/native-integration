anchor = "51-build-floors"
description = "An Android floor, and a **TOML integer** — `\"24\"` and `24.0` are rejected. The build fails when the application is lower; the consumer never raises it"

[declarations."android.requires.compile_sdk"]
node = "field"
type = "integer"
category = "requires"
platform = "android"
required = false
