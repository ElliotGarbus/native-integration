[declarations."android.requires.core_library_desugaring"]
node = "field"
type = "boolean"
only_true = true
category = "requires"
platform = "android"
required = false
since = "1.0"
section = "5.1"
anchor = "51-build-floors"
description = "Optional boolean, and only `true` is valid — a consumer rejects `false`. A floor on a boolean axis: the build fails when the application has not enabled desugaring"

[declarations."ios.requires.deployment_target"]
node = "field"
type = "string"
pattern = '[0-9]+(\.[0-9]+){0,2}'
category = "requires"
platform = "ios"
required = false
merge = "maximum"
since = "1.0"
section = "5.1"
anchor = "51-build-floors"
description = "The iOS floor, and a **TOML string** where the three above are integers. One to three ASCII-decimal components, compared component-wise and numerically with absent components read as zero"


