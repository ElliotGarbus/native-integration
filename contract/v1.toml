# Fixed string lists SPEC.md gives normative weight, which are not declaration
# keys and so cannot be rows above. The schema generator reads them; §4.3's
# under-declaration rule reads their `since`.

[registers.capability_keys]
section = "7.4"
anchor = "74-infoplist"
since = "1.0"
closed = true
members = [
  "UIBackgroundModes",
  "UIRequiredDeviceCapabilities",
  "CFBundleURLTypes",
  "NSUserActivityTypes",
]

# A5: closed at four. §5.5 spells the same set with "such as"; §7.4 enumerates
