# The v1 declaration registry.
#
# One machine-readable source of truth for the contract-1 declaration
# vocabulary, derived entirely from SPEC.md. Three generators read it:
#
#   tools/gen_appendix_b.py   → SPEC.md's Appendix B table
#   tools/gen_schema.py       → schema/native-integration-v1.schema.json
#   tools/gen_error_ids.py    → contract/diagnostics-v1.toml
#
# and tools/check_spec.py fails when any of the three would produce a diff
# against what is committed. Without that check this file becomes a second
# source of truth rather than the source of truth.
#
# WHAT BELONGS HERE: mechanical properties only — path, node shape, type,
# category, platform, cardinality, closed vocabularies, required/optional,
# merge semantics where SPEC.md states one, `since`, and the section anchor.
# The `description` field carries Appendix B's own summary text, which is what
# lets that table be generated rather than hand-maintained beside this file.
#
# WHAT DOES NOT: rationale. SPEC.md's `> **Note:**` and `> **Caution:**`
# callouts explain why each rule is the way it is and are what make the
# document reviewable. They stay in §§4–7, hand-written, and nothing here
# touches them.
#
# Where this file and SPEC.md disagree, SPEC.md governs and this file is the
# defect.

[meta]
contract = "1.0"
spec = "SPEC.md"
entry_point_group = "native_integration.v1"

# Node shapes: `table` is a `[x]` header, at most once; `array_of_tables` is
# `[[x]]`, repeatable; `open_table` is a table whose *key names* belong to the
# platform rather than to this document; `field` is a leaf.
#
# Categories: `top_level`, `owns`, `requires`, `contributes` — §2.1's three,
# plus the two keys that sit above them.
#
# `<platform>` in an id means the declaration is spelled identically under
# `[android]` and `[ios]`. A concrete `android.` or `ios.` prefix means the
# declaration belongs to that platform's table and nowhere else.


# ---------------------------------------------------------------- Top level ---

[declarations."contract"]
node = "field"
type = "string"
category = "top_level"
platform = "both"
required = true
pattern = '(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?'
since = "1.0"
section = "4.3"
anchor = "43-contract-version"
description = '**Required.** Major of this document, optionally with a minor — `"1"` or `"1.1"`.'

[declarations."platforms"]
node = "field"
type = "array"
items = "enum"
values = ["android", "ios"]
closed = true
min_items = 1
category = "top_level"
platform = "both"
required = false
since = "1.0"
section = "4.5"
anchor = "45-platform-support"
description = "Optional. Where the distribution *functions*, not merely where it contributes; a build for an omitted platform fails."


