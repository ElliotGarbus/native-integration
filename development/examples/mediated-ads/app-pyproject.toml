# The APPLICATION's pyproject.toml, for the three ad packages beside it.
#
# `examples/pystripe/` carries the only other one of these, and it answers a
# single package. This answers three at once, which is what the set was written
# for: the join keys of §2.2, How the application answers, have never been
# exercised at N > 1, and the surface an application has to answer roughly
# doubled in the last round.
#
# ILLUSTRATIVE SPELLING. §2.2 defines the capability a consuming tool must
# provide and deliberately not the syntax; `examplebuild` is a placeholder.
# What is *not* illustrative is the join: every answer is filed under the
# declaring distribution plus the key the declaration named.

[project]
name = "trailmap-ads"
dependencies = ["pyadmob", "pyadmob-applovin", "pyadmob-mintegral"]

# --- build floors (§5.1) ----------------------------------------------------
# All three packages require min_sdk 23 and deployment_target 15.0. Floors are
# checked, never raised: the highest floor any package declares must be met by
# what is written here, and the build fails naming the package if it is not.

[tool.examplebuild.android]
min_sdk = 24
compile_sdk = 35

[tool.examplebuild.ios]
deployment_target = "15.0"

# --- one of §5.2's values per vendor ----------------------------------------
# Three packages, three vendor keys, three separate answers. Nothing here is
# shared between them: the mediation SDK needs the AdMob ID and each adapter
# needs its own network's credentials. That is why the per-distribution scoping
# of §5.2 is not strained by mediation — see NOTES.md, finding MA2.

[tool.examplebuild.native.pyadmob.android.application_values]
admob_app_id = "ca-app-pub-3940256099942544~3347511713"

[tool.examplebuild.native.pyadmob-applovin.android.application_values]
applovin_sdk_key = "kQF3nQ4hZ8k5rC7pW2mYxT1vB6dL9sJ0"

[tool.examplebuild.native.pyadmob-mintegral.android.application_values]
mintegral_app_id = "1000037"
mintegral_app_key = "7c22942b749fe6a6e361b675e96b3ee9"

# --- the same `id`, a different value (§5.2) --------------------------------
# pyadmob declares `admob_app_id` on both platforms, because the SDK needs one
# on each — and the AdMob console issues a *different* ID per platform. This is
# the case the rationale of §5, Requirements on the application, gives for
# parallel platform tables rather than one platform-neutral table answered once.
#
# So the join is (platform, distribution, id), not (distribution, id): the same
# key under `ios` carries a different value, and neither answer would be correct
# for the other build. Writing this file is what made that explicit — see
# NOTES.md, finding MA5.

[tool.examplebuild.native.pyadmob.ios.application_values]
admob_app_id = "ca-app-pub-3940256099942544~1458002511"
# The conditional value the next section is about. It sits here because TOML
# has one table per path, not because the two answers are related.
tracking_usage_description = "Trailmap uses your activity to show ads for gear you might actually want."

# --- a conditional value, answered (§5.2, §5.5) -----------------------------
# pyadmob declares NSUserTrackingUsageDescription as `conditional = true`:
# required only if the application asks for App Tracking Transparency. Leaving
# it out would not fail the build — the unresolved requirement would be recorded
# instead — so supplying it is a statement that this application does request
# tracking.
#
# The sentence is the application's to write. §5.5, Value kinds, refuses a
# producer offering one: it is user-facing text that App Store review reads,
# and no library can write it truthfully on the application's behalf. Note the
# join: it is filed under `pyadmob` and the `id` pyadmob gave it, not under the
# plist key — the key is where the answer lands, not what identifies the
# question. The answer itself is in the
# `[…pyadmob.ios.application_values]` table above.

# --- one of §5.3's actions, acknowledged ------------------------------------
# Mintegral's SDK takes its credentials as arguments to an initialization call
# rather than reading them from the manifest, so no declaration can deliver
# them: the two values above are `inline`, and this is the call that consumes
# them. §5.4, How a requirement is satisfied, makes the acknowledgement the
# satisfaction — the consumer cannot see whether the call was written, and
# requirement 15 in §8.4, Requirements, forbids it from inferring one from
# anything it happens to observe.
#
# The acknowledgement is held open until both values are supplied, which is why
# it sits below them rather than beside them.

[tool.examplebuild.native.pyadmob-mintegral.android.acknowledged]
initialize_mintegral = { date = "2026-08-24" }

# --- accepting the first build (§9.1, The lifecycle) ------------------------
# §9.1 makes the first build step 4 rather than an exemption:
# when no accepted record exists every contribution is new, and a consumer must
# require the same explicit acceptance it would require for a change. "A single
# bootstrap action covering the initial set satisfies this; treating 'no record
# yet' as implicit approval does not, because the first build is the one where
# an application acquires *all* of its inherited native surface at once."
#
# This is that bootstrap action, and it is the one line in this file that is
# about the integration rather than about a package. Three ad SDKs arrive with
# four permissions, a Maven repository, two `<meta-data>` entries and an
# `SKAdNetworkItems` list between them — the largest single acquisition this
# application will ever make, and the build that would otherwise wave it
# through unread.
#
# It is an answer, so §9.1's second half applies: it is recorded as it changes
# and never gated itself, and it never reaches the record beside it. A record
# that changed on being accepted could not be compared against the thing that
# was accepted.

[tool.examplebuild.initial_acceptance]
date = "2026-08-24"

# --- what is NOT here -------------------------------------------------------
#
# No suppression, no export approval, no packaging choice. An ads integration
# asks the application for account credentials, one sentence and one
# initialization call — which is worth seeing beside pystripe, where a single
# package needed an exported component approved and a URL callback
# acknowledged. The size of the application's half tracks what the packages
# actually do, not how many of them there are.
#
# The AD_ID permission — §6.5, Permissions and features — is the one thing an
# application might want to refuse here, and refusing is a line it would add
# rather than one it inherits:
#
#     [tool.examplebuild.android]
#     suppress_permissions = ["com.google.android.gms.permission.AD_ID"]
#
# That is left out because this application does serve personalized ads. A
# children's-category application would add it, and the report of §9, Recording
# and review, would carry the suppression so the choice stays visible.
