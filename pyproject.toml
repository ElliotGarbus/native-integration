[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "native-integration"
version = "0.1.0.dev0"
description = "Reference reader for the native-integration specification"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Elliot Garbus" }]
keywords = ["android", "ios", "packaging", "native", "build"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
# The reader's own test suite, and nothing else. `tools/` is not in the wheel,
# so an extra carrying a checker's dependency would offer an installing user a
# package for a script they do not have; CI installs `jsonschema` itself, and
# `tools/check_spec.py` reports its absence rather than skipping the schema
# cases in silence.
test = ["pytest>=7"]

# Non-normative, and its own documentation says so. SPEC.md is the contract;
# this is a way to retrieve one rule out of it.
[project.scripts]
native-integration = "native_integration.cli:main"

[project.urls]
Specification = "https://github.com/ElliotGarbus/native-integration/blob/main/SPEC.md"
Source = "https://github.com/ElliotGarbus/native-integration"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
native_integration = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
