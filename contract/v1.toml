[declarations."android.contributes.gradle_dependencies"]
node = "array_of_tables"
category = "contributes"
platform = "android"
required = false
exactly_one_of = ["coordinate", "module"]
since = "1.0"
section = "6.3"
anchor = "63-gradle-dependencies"
description = "A dependency is spelled in **exactly one** of two forms — an exact `coordinate`, or a `module` with a bounded `version`. Declaring both, or neither, is rejected"

[declarations."android.contributes.gradle_dependencies.coordinate"]
node = "field"
type = "string"
# §6.3: `group:artifact:version`, and changing versions (`-SNAPSHOT`),
# unbounded dynamic versions (`+`, `latest.release`) and ranges spelled inside
# a coordinate are invalid.
pattern = '(?!.*(-SNAPSHOT|\+|latest\.|\[|\]|\(|\)|,))[^:\s]+:[^:\s]+:[^:\s]+'
category = "contributes"
platform = "android"
required = false
since = "1.0"
section = "6.3"
anchor = "63-gradle-dependencies"
description = "`group:artifact:version`, exactly versioned. The version is visible in the sidecar, but it states no upper bound: Gradle may resolve past a major the producer never compiled against"

[declarations."android.contributes.gradle_dependencies.module"]
node = "field"
type = "string"
# §6.3: `group:artifact`, with the version carried by `version`.
pattern = '[^:\s]+:[^:\s]+'
category = "contributes"
platform = "android"
required = false
since = "1.0"
section = "6.3"
anchor = "63-gradle-dependencies"
description = "`group:artifact`, paired with a bounded `version`. **Recommended** where the producer's own source compiles against the dependency, because `below` is the only way to say which major it cannot survive"

[declarations."android.contributes.gradle_dependencies.version"]
node = "field"
type = "inline_table"
table_keys = ["at_least", "below"]
table_keys_required = ["at_least", "below"]
table_value_type = "string"
# §6.3: a bound is a version, never a changing or dynamic one.
table_value_pattern = '(?!.*(-SNAPSHOT|\+|latest\.))[0-9A-Za-z][0-9A-Za-z._-]*'
category = "contributes"
platform = "android"
required = false
required_when = "module"
forbidden_when = "coordinate"
since = "1.0"
section = "6.3"
anchor = "63-gradle-dependencies"
description = "**Required** with `module` and **forbidden** with `coordinate`. **Both** `at_least` (inclusive) and `below` (exclusive) are required within it; a range open at either end is invalid, as are changing (`-SNAPSHOT`) and dynamic (`+`, `latest.release`) versions"

