# PyOneSignal — https://github.com/PyPlatformPackages/PyOneSignal
#
# Everything in this file is valid under contract "1". It is NOT the whole
# integration: the parts version 1 cannot express are listed in NOTES.md, and
# the shape they would need is sketched there. Read that file before treating
# this one as a worked example of a complete integration.

contract = "1"

# ---------------------------------------------------------------- Android ---

[android.requires]
# OneSignal Android SDK 5.x floor.
min_sdk = 23
# POST_NOTIFICATIONS is an API 33 constant; the AAR itself also compiles
# against 34.
compile_sdk = 34

[[android.contributes.gradle_dependencies]]
# Upstream documents this as the range "[5.6.1, 5.9.99]". Finding A1 argued the
# ban on ranges contradicted §7.4, which permits `from`; §6.5 now takes the
# bounded form, so the producer no longer has to pin and re-release per patch.
module = "com.onesignal:OneSignal"
version = { at_least = "5.6.1", below = "6.0.0" }

[[android.contributes.permissions]]
name = "android.permission.INTERNET"
reason = "OneSignal REST API and FCM delivery"

[[android.contributes.permissions]]
name = "android.permission.POST_NOTIFICATIONS"
reason = "Displaying push notifications on Android 13+"

[android.contributes.r8]
# The Python half reaches com.onesignal.* entirely through pyjnius: autoclass()
# for OneSignal/Continue, and PythonJavaClass implementations of
# com.onesignal.notifications.INotificationClickListener and
# INotificationLifecycleListener. None of it is visible to the shrinker.
# Permitted by §6.9 scope 2 — the group of a coordinate this sidecar declares.
keep_classes = ["com.onesignal.**"]

# -------------------------------------------------------------------- iOS ---

[ios.requires]
deployment_target = "12.0"

[[ios.requires.entitlements]]
key = "aps-environment"
reason = "APNs push delivery"

[[ios.requires.entitlements]]
key = "com.apple.security.application-groups"
reason = """\
Shared container between the app and the OneSignal notification service \
extension, required for confirmed delivery, badges, and image attachments. \
OneSignal expects group.<main-app-bundle-id>.onesignal, and the same group \
must be set on both targets."""

[[ios.requires.app_extensions]]
# Finding B1. The notification service extension stays application-authored —
# in the only working integration of this package, its target is configured in
# the application's own project file and NotificationService.swift lives in the
# application's tree. §7.3 does not let the producer contribute it; it lets the
# producer say it is needed, so the loss is reported rather than discovered
# when notifications arrive without images.
kind = "notification_service"
reason = """\
Confirmed delivery, badge counts and image attachments are unavailable \
without it. Link OneSignalExtension into the extension target, and give it \
the same app group as the application."""

[[ios.contributes.swift_packages]]
name = "OneSignal"
url = "https://github.com/OneSignal/OneSignal-XCFramework"
requirement = { from = "5.4.1" }
products = ["OneSignalFramework"]

[ios.contributes.info_plist.append]
UIBackgroundModes = ["remote-notification"]
