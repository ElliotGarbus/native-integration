name: Consistency checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: SPEC, README and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # tomllib is stdlib from 3.11
          python-version: "3.12"
      - name: Install the schema validator
        run: python3 -m pip install jsonschema
      - name: Check consistency
        run: python3 tools/check_spec.py
      - name: Check Appendix B matches the registry
        run: python3 tools/gen_appendix_b.py --check
      - name: Check the JSON Schema matches the registry
        run: python3 tools/gen_schema.py --check
      - name: Check the diagnostic IDs match the registry
        run: python3 tools/gen_error_ids.py --check
      - name: Check the requirement map is current
        run: python3 tools/requirements_table.py --check
      - name: Check the table of contents is current
        run: python3 tools/toc.py --check
      - name: Check the worked integration records are current
        run: python3 tools/record_example.py --check
      - name: Check the packaged authoring guide matches SPEC.md
        run: python3 tools/gen_authoring_guide.py --check

  reader:
    name: Reference reader
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 3.11 is the floor: tomllib. Windows is here because a hashed input
        # and a checkout that rewrites line endings is a Windows-class failure,
        # and the suite had only ever run where it cannot happen.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  wheel:
    # The artifact, not the checkout. Twice a file the package needed was not
    # in the wheel -- the registry, then the packaged authoring guide -- and
    # every job here installed editable, where a checkout's parent directory
    # supplied what the wheel lacked. Build it, install it somewhere with no
    # checkout above it, and run each command once.
    name: Installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install it into a clean environment, away from the checkout
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
      - name: Import, and run each subcommand from the install
        working-directory: /tmp
        run: |
          /tmp/clean/bin/python -c "import native_integration; print(native_integration.__version__)"
          /tmp/clean/bin/native-integration --version
          /tmp/clean/bin/native-integration explain ni.req.29 > /dev/null
          /tmp/clean/bin/native-integration explain android.contributes.r8 --json > /dev/null
          /tmp/clean/bin/native-integration authoring-guide > /dev/null
          /tmp/clean/bin/native-integration authoring-guide --template > /dev/null
          /tmp/clean/bin/native-integration inspect "$GITHUB_WORKSPACE/examples/pystripe" > /dev/null
          /tmp/clean/bin/native-integration validate "$GITHUB_WORKSPACE/examples/pystripe" --explain-failures
