# pyadmob — HYPOTHETICAL. Google Mobile Ads, the mediation SDK an application
# adds first. Two adapter sidecars sit beside this one; the point of the set is
# what happens when all three are in one application, not what any one says.
#
# Versions and SKAdNetwork identifiers are illustrative, read in August 2026.

contract = "1"
platforms = ["android", "ios"]

# ---------------------------------------------------------------- Android ---

[android.requires]
min_sdk = 23
compile_sdk = 35

# The legacy manifest-read case §5.2, Values, was written for: GMA reads this
# before any Python runs and fails at startup without it.
[[android.requires.application_value]]
id = "admob_app_id"
kind = "manifest_meta_data"
key = "com.google.android.gms.ads.APPLICATION_ID"
reason = """\
Your AdMob application ID, from the AdMob console. It is per-platform: the \
Android and iOS consoles issue different IDs."""
placeholder = "<TODO: your AdMob Android app ID, ca-app-pub-…~…>"

[[android.contributes.gradle_dependencies]]
module = "com.google.android.gms:play-services-ads"
version = { at_least = "24.0.0", below = "25.0.0" }

[[android.contributes.permissions]]
name = "android.permission.INTERNET"
reason = "Ad requests and creative delivery"

[[android.contributes.permissions]]
name = "android.permission.ACCESS_NETWORK_STATE"
reason = "Connectivity checks before an ad request"

[[android.contributes.permissions]]
name = "com.google.android.gms.permission.AD_ID"
# The `reason` is read by an application developer in a build report, so it
# names the choice rather than the section that governs it — suppression is
# §6.5, Permissions and features, and citing that here would be the producer
# explaining the specification to someone who just wants to know whether to
# refuse the permission.
reason = """\
Reads the advertising ID for ad personalization. Suppress it if your \
application is in a children's category."""

# A producer-known constant, not an application value — the case §6.8, Manifest
# meta-data, exists for. The AppLovin adapter beside this one sets the same key
# to the same value, which is the coalescing path rather than the conflict path.
[[android.contributes.meta_data]]
key = "com.google.android.gms.ads.flag.OPTIMIZE_INITIALIZATION"
value = true
reason = "Moves ad initialization off the first frame; both mediation packages want it"

# -------------------------------------------------------------------- iOS ---

[ios.requires]
deployment_target = "15.0"

# The table §5.2's rationale predicted, and the reason identity is scoped by
# platform as well as by distribution: this value is *not* the Android one,
# under the same `id`.
[[ios.requires.application_value]]
id = "admob_app_id"
kind = "info_plist"
key = "GADApplicationIdentifier"
reason = """\
Your AdMob application ID for iOS, from the AdMob console. Different from the \
Android ID for the same application."""
placeholder = "<TODO: your AdMob iOS app ID, ca-app-pub-…~…>"

# §5.5, Value kinds: a usage description is the application's own sentence, in
# its own voice, and a producer that wrote one would be putting words in App
# Review's ear on the application's behalf. So the producer asks, and does not
# supply.
[[ios.requires.application_value]]
id = "tracking_usage_description"
kind = "usage_description"
key = "NSUserTrackingUsageDescription"
conditional = true
reason = "Required only if you request App Tracking Transparency for personalized ads"

[[ios.contributes.swift_packages]]
name = "GoogleMobileAds"
url = "https://github.com/googleads/swift-package-manager-google-mobile-ads"
requirement = { from = "12.0.0" }
products = ["GoogleMobileAds"]

[ios.contributes]
# Static libraries carrying the §7.6 Objective-C categories; without this the
# linker drops them and the SDK dies on an unrecognized selector.
objc_categories = true

[ios.contributes.info_plist]
# Google's own identifier, plus the mediated networks AdMob's documentation
# lists. Both adapters repeat some of these — the de-duplication case in §7.4,
# Info.plist.
skadnetwork_identifiers = [
  "cstr6suwn9.skadnetwork",
  "ludvb6z3bs.skadnetwork",
  "4dzt52r2t5.skadnetwork",
]
