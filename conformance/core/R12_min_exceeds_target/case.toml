# §8.4 requirement 12, via §5.1's added paragraph: "A declared floor on one key
# can bind another." Android's build tooling requires
# `min_sdk <= target_sdk <= compile_sdk` unconditionally, so a consumer MUST
# additionally fail, naming the distribution, when a declared `min_sdk` is
# higher than the application's configured `target_sdk` — even though
# `min_sdk`'s own floor, checked against the application's configured
# `min_sdk`, is separately met.
#
# Android: not caught by the per-key checks alone. The application configures
# `min_sdk = 31`, which meets the declared floor of 31 on that key exactly; the
# violation is only visible by comparing the declared value against a
# *different* key's configured value — here, a `target_sdk` the application
# left at 30.
#
# iOS has no ordering to violate — one distribution, exercised on both
# platforms it binds, is requirement 12's own `deployment_target` floor, unmet
# in the ordinary way §5.1 already covers.
requirement = 12
profile     = "core"
section     = "5.1"

outcome = "blocking"

diagnostics = [
  { id = "ni.req.12", distributions = ["pyr12min"] },
]
advisories  = []
assertions  = []
