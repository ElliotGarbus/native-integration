# §8.4 requirement 1: restrict candidate producers to the application's resolved
# dependency closure, and never accept contributions from a distribution outside
# it, whatever else is installed alongside.
#
# `pyunrelated` is in input/closure.toml marked `not-in-closure`, and it ships a
# deliberately loud sidecar on both platforms: a permission nothing asked for,
# and a floor above what the application configures. A consumer that enumerates
# entry points across whatever is installed, rather than filtering against the
# closure, reads it and fails the build — so the rule is what breaks, rather
# than a missing file.
#
# The fixture originally shipped no sidecar for it at all, which made the case
# pass for the wrong reason: there was nothing to accept, so a consumer ignoring
# `origin = "not-in-closure"` failed to find files rather than failing the rule.
# Recorded in development/findings/phase3-reader.md.
requirement = 1
profile     = "core"
section     = "3.2"

outcome = "accept"

diagnostics = []
advisories  = []

assertions = [
  "no_producer_import",
  "sidecar_excluded_from_payload",
  "contributed_source_excluded_from_payload",
]

# No `record` key: a core case is compared against `expected/<platform>.record`,
# which is the only form that can differ per platform, and this one does.
