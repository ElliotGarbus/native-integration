# PyCoreLocation — https://github.com/PyPlatformPackages/PyCoreLocation
#
# Valid under contract "1". See NOTES.md — this example is less a success than
# it looks. Two of the entries below are things version 1 permits that it
# probably should not, and the package's central requirement (registering its
# Swift-implemented Python module with the interpreter) is absent because there
# is no way to say it.

contract = "1"

# Finding L6: the wheel is pure Python and installs anywhere, so an application
# could depend on this and build for Android — getting a clean build and an
# app that fails at import, or silently ships the typing stub. §4.5 now
# distinguishes "contributes nothing here" from "does not work here".
platforms = ["ios"]

# -------------------------------------------------------------------- iOS ---

[ios.requires]
# Package.swift declares .iOS(.v13); PyLocationManager guards iOS 14 APIs with
# #available.
deployment_target = "13.0"

[[ios.contributes.swift_packages]]
# The producer declares *itself*. The wheel carries only a typing stub —
# src/py_core_location.py is marked "do not try add this file to a real app" —
# so the implementation arrives here, from git, not from the distribution.
# See NOTES.md, finding L1.
#
# It has to be a revision, not a version: the repository carries no git tags at
# all, so SwiftPM cannot resolve it by version and the only two forms left are
# `revision` and `branch` — and §7.4 forbids `branch`. The distribution's own
# version (0.1.0) therefore appears nowhere in the declaration.
name = "PyCoreLocation"
url = "https://github.com/PyPlatformPackages/PyCoreLocation"
requirement = { revision = "fd5fd803339e3d3161011c26de53326d54766c84" }
products = ["PyCoreLocation"]

[[ios.contributes.python_modules]]
# Finding L2, the blocking one: `@PyModule struct PyCoreLocation` *is* the
# Python module, compiled into the app target rather than loaded from a shared
# object, so nothing could make it importable. §7.7 registers it.
#
# The registration also retires src/py_core_location.py from the payload — the
# generated stub whose header says "do not try add this file to a real app".
# Left on sys.path it would turn a failed registration into an app that imports
# fine and returns None from every call.
name = "py_core_location"
swift_package = "PyCoreLocation"
init = "PyInit_PyCoreLocation"

[[ios.requires.usage_descriptions]]
# Finding L3: version 1 originally had no home for this but
# [ios.contributes.info_plist.values], which made the *producer* write a
# user-facing, localized, App Store reviewed sentence about what the
# application does with location. §7.3 now takes it as a prerequisite: the
# producer states the need, the application writes the words, and §7.6 rejects
# any UsageDescription key offered as a contribution.
key = "NSLocationWhenInUseUsageDescription"
reason = "requestWhenInUseAuthorization() traps if this key is absent"

# Finding L4: the rest of this binding's requirements vary per method, and a
# 1:1 binding of CLLocationManager has no seam to split along — so §12's
# "ship optional distributions" cannot apply. The choice used to be between
# handing every application the union and leaving callers to trap at runtime.
# §7.3's conditional prerequisites are the third option, and §12.1 now says so.

[[ios.requires.usage_descriptions]]
key = "NSLocationAlwaysAndWhenInUseUsageDescription"
conditional = true
reason = "Required only if your application calls requestAlwaysAuthorization()"

[[ios.requires.usage_descriptions]]
key = "NSLocationTemporaryUsageDescriptionDictionary"
conditional = true
reason = """\
Required only if your application calls \
requestTemporaryFullAccuracyAuthorization(purposeKey:); its keys are the \
purpose keys your application passes."""

[[ios.requires.app_extensions]]
id = "corelocation_push_ext"
kind = "location_push"
conditional = true
reason = """\
Required only if your application calls startMonitoringLocationPushes(). \
Also needs com.apple.developer.location.push, which Apple must approve."""

# Still absent, and correctly so: UIBackgroundModes = ["location"] is a
# contribution, not a prerequisite, and §7.6 has no conditional form. A
# producer cannot know whether an application wants background location, and
# declaring it would hand the capability to every application. It stays the
# application's to add.
