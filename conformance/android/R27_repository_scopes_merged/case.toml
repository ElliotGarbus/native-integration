# §8.4 requirement 27, via §6.4: "**Two distributions may declare the same
# repository, and it merges by one rule.** Repository identity is the `url`,
# compared with its scheme case-insensitively and the rest byte-for-byte."
# `groups` and `modules` union; any `credentials_required = true` wins; every
# `reason` is kept, attributed to the distribution that wrote it.
#
# The other side of `R27_repository_scope_overlap`. There two repositories
# contest a group and the build fails; here one repository is declared twice and
# the build proceeds — and §6.4 is explicit that the same url "is not a
# conflict". A consumer that treated every second declaration as an overlap
# would fail this, and one that skipped it without merging would configure a
# repository narrower than what was declared.
#
# The merge runs in both directions at once, which is why one case carries all
# of it. `pyscope` declares the repository open and bounded to a group;
# `pyauth` declares the same one authenticated and bounded to a module in a
# group `pyscope` never named. The configured repository serves both bounds and
# needs a credential — so the careful-looking declaration loses twice, exactly
# as §6.5's permission merge loses one section later.
#
# `pyauth` writes the scheme in upper case. §6.4 compares it case-insensitively,
# so this is one repository and not two; the application answers with one
# credential, spelled the other way, and that answers it.
#
# What the record must carry is the result. Two `gradle-repository` facts say
# who asked for what and keep both reasons attributed; the `effective` fact says
# what will actually be configured, which is the thing a reviewer cannot
# reconstruct without redoing the merge.
requirement = 27
profile     = "android"
section     = "6.4"

outcome = "accept"

diagnostics = []
advisories  = []
assertions  = []

record = "android.record"
